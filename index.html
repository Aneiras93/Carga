<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CARGA — Treinos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F2EC; --s1:#FFFFFF; --s2:#EFEBE3; --s3:#E4DED3; --line:#E6E0D5;
  --tx:#1B1E1C; --mut:#6B6860; --dim:#8E8A81;
  --y:#2F5645; --y2:#3B6B56; --ytx:#F7F4EE; --red:#B5533C;
  --yt:rgba(47,86,69,.10); --yt2:rgba(47,86,69,.22); --rt:rgba(181,83,60,.10);
  --r:14px;
  --fc:'Urbanist',-apple-system,'Segoe UI',Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx)}
body{font-weight:500;font-family:'Urbanist',-apple-system,'Segoe UI',Roboto,system-ui,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--tx)}
a{color:inherit;text-decoration:none}
svg{display:block}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.pb{padding-bottom:180px}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(245,242,236,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px;min-height:60px}
.logo{font-family:var(--fc);font-weight:700;font-size:26px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.logo i{display:inline-block;width:10px;height:22px;background:var(--y);transform:skewX(-14deg)}
.who{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;font-weight:700;padding:4px 8px;border-radius:20px;background:var(--s2)}
.who.p{background:var(--yt);color:var(--y)}
.sync{margin-left:auto;font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.sync b{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.sync.ok b{background:var(--y)}
.sync.err b{background:var(--red)}
.tt{flex:1;min-width:0}
.tt small{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.tt div{font-family:var(--fc);font-weight:700;font-size:22px;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--s2);flex:none}
.ib:active{background:var(--s3)}
.ib.danger{color:var(--red)}
.clock{font-family:var(--fc);font-weight:700;font-size:22px;color:var(--tx);font-variant-numeric:tabular-nums}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 20px}
.login-in{max-width:400px;width:100%;margin:0 auto}
.login .logo{font-size:44px;margin-bottom:6px}
.login .logo i{width:14px;height:34px}
.login h1{font-family:var(--fc);font-weight:700;font-size:30px;text-transform:none;line-height:1.05;margin:28px 0 6px}
.login p{color:var(--mut);margin-bottom:22px}
.login label{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin:14px 0 6px}
.login .err{color:var(--red);font-weight:600;font-size:14px;margin-top:12px;min-height:20px}
.login .hint{font-size:13px;color:var(--dim);margin-top:22px;text-align:center}
.stripe{height:6px;background:repeating-linear-gradient(-55deg,var(--y) 0 14px,transparent 14px 28px);opacity:.9;margin-bottom:32px;border-radius:3px}

/* page title */
.ph{padding:22px 0 12px}
.ph h1{font-family:var(--fc);font-weight:700;font-size:34px;line-height:1;text-transform:none}
.ph p{color:var(--mut);margin-top:6px}
.lbl{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;font-weight:600;margin:22px 0 10px}

/* buttons */
.btn{height:50px;padding:0 20px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;text-transform:uppercase;letter-spacing:.04em}
.btn.y{background:var(--y);color:var(--ytx)}
.btn.y:active{background:var(--y2)}
.btn.y:disabled{opacity:.5}
.btn.ghost{background:var(--s1);border:1px dashed var(--line);color:var(--tx)}
.btn.dark{background:var(--s2)}
.btn.red{background:var(--red);color:#fff}
.btn.sm{height:38px;padding:0 14px;font-size:13px;border-radius:10px}
.full{width:100%}
.link{color:var(--y);font-weight:600;font-size:14px;padding:8px 0}

/* cards */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r)}
.hero{padding:18px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border:18px solid var(--s2);border-radius:50%}
.hero .k{font-size:12px;color:var(--y);text-transform:uppercase;letter-spacing:.12em;font-weight:700;position:relative}
.hero h2{font-family:var(--fc);font-weight:700;font-size:30px;text-transform:none;line-height:1.05;margin:6px 0 4px;position:relative}
.hero p{color:var(--mut);position:relative;margin-bottom:14px}
.banner{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--y);color:var(--ytx);border-radius:var(--r);margin-top:16px;font-weight:700;width:100%;text-align:left}
.banner small{display:block;font-weight:500;opacity:.75}
.fnote{margin-top:12px;font-size:13px;color:var(--mut);background:var(--s1);border:1px solid var(--line);border-left:3px solid var(--y);padding:10px 12px;border-radius:10px}
.fnote b{color:var(--tx)}

.tl{display:flex;flex-direction:column;gap:10px}
.tc{display:flex;align-items:center;gap:14px;padding:14px;text-align:left;width:100%}
.tc:active{background:var(--s2)}
.letter{width:52px;height:52px;border-radius:12px;background:var(--s2);display:grid;place-items:center;font-family:var(--fc);font-weight:700;font-size:28px;color:var(--tx);flex:none}
.tc .info{flex:1;min-width:0}
.tc b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc small{color:var(--mut);font-size:13px;display:block}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;padding:3px 8px;border-radius:20px;background:var(--s2);color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.tag.y{background:var(--yt);color:var(--y)}
.play{width:42px;height:42px;border-radius:50%;background:var(--y);color:var(--ytx);display:grid;place-items:center;flex:none}

/* fase */
.fbar{display:flex;gap:8px;margin-top:4px}
.fb{flex:1;padding:10px 12px;border-radius:12px;background:var(--s1);border:1px solid var(--line);text-align:left}
.fb b{display:block;font-family:var(--fc);font-weight:700;font-size:18px;text-transform:none}
.fb small{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.fb.on{border-color:var(--y)}
.fb .dot{width:7px;height:7px;border-radius:50%;background:var(--y)}
.factive{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--mut)}
.factive .btn{margin-left:auto}

/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:560px;margin:0 auto;display:grid}
.nav button{padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.nav button.on{color:var(--y)}
.nav button.on svg{filter:none}

/* week */
.week{display:flex;flex-direction:column;gap:8px}
.day{display:flex;align-items:stretch;gap:0;overflow:hidden}
.day .dn{width:70px;flex:none;padding:14px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid var(--line);background:var(--s2)}
.day .dn b{font-family:var(--fc);font-weight:700;font-size:22px;text-transform:uppercase}
.day .dn small{font-size:12px;color:var(--mut)}
.day .dc{flex:1;padding:12px 14px;display:flex;flex-direction:column;gap:8px;justify-content:center;min-width:0}
.day.today{border-color:var(--y)}
.day.today .dn{background:var(--y);color:var(--ytx)}
.day.today .dn small{color:var(--ytx);opacity:.7}
.rest{color:var(--dim);font-size:14px}
.dt{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.dt .lt{font-family:var(--fc);font-weight:700;color:var(--tx);font-size:20px;width:22px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:20px;background:var(--s2);color:var(--mut);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;border:1px solid transparent}
.chip.on{background:var(--y);color:var(--ytx)}
.search{width:100%;height:46px;border-radius:12px;background:var(--s1);border:1px solid var(--line);padding:0 14px 0 42px;outline:none;margin-bottom:12px}
.search:focus{border-color:var(--y)}
.sw{position:relative}
.sw svg{position:absolute;left:14px;top:13px;color:var(--mut)}

/* exercise list */
.el{display:flex;flex-direction:column}
.ei{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.gi{width:40px;height:40px;border-radius:10px;background:var(--s2);display:grid;place-items:center;color:#4A5A52;flex:none}
.ei .info{flex:1;min-width:0}
.ei b{font-weight:600;display:block}
.ei small{color:var(--mut);font-size:13px}
.ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--s3);display:grid;place-items:center;flex:none;color:transparent}
.ei.sel .ck{background:var(--y);border-color:var(--y);color:var(--ytx)}
.grp-h{font-family:var(--fc);font-weight:700;text-transform:none;color:var(--tx);font-size:15px;letter-spacing:-.01em;margin:20px 0 2px}
.empty{color:var(--mut);text-align:center;padding:36px 16px}

/* video */
.vbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:9px;background:var(--s2);color:var(--y);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;flex:none}
.vbtn.s{color:var(--mut)}
.vbtn:active{background:var(--s3)}
.vic{width:34px;height:34px;border-radius:9px;background:var(--s2);display:grid;place-items:center;color:var(--y);flex:none}
.vic.s{color:var(--dim)}

/* editor */
.ed-head{display:flex;gap:10px;margin-top:18px}
.inp{height:50px;border-radius:12px;background:var(--s1);border:1px solid var(--line);padding:0 14px;outline:none;width:100%}
.inp:focus{border-color:var(--y)}
.letra{width:64px;flex:none;text-align:center;font-family:var(--fc);font-weight:700;font-size:26px;color:var(--y);text-transform:none;padding:0}
.nome{font-weight:600;font-size:17px}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dia{height:44px;border-radius:10px;background:var(--s1);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--mut)}
.dia.on{background:var(--y);color:var(--ytx);border-color:var(--y)}
.fases{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.exc{padding:14px;margin-bottom:10px}
.exc-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.exc-h .info{flex:1;min-width:0}
.exc-h b{display:block;font-weight:700}
.exc-h small{color:var(--mut);font-size:12px}
.num{font-family:var(--fc);font-weight:700;font-size:18px;color:var(--dim);width:18px;text-align:center}
.ord{display:flex;gap:4px}
.ord button{width:32px;height:32px;border-radius:8px;background:var(--s2);display:grid;place-items:center;color:var(--mut)}
.ord button:disabled{opacity:.3}
.ord button.x{color:var(--red)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.g4 label{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.g4 input{display:block;width:100%;height:42px;margin-top:4px;border-radius:10px;background:var(--s2);border:1px solid transparent;text-align:center;font-weight:700;font-size:16px;outline:none}
.g4 input:focus,.obs:focus{border-color:var(--y)}
.obs{width:100%;height:40px;margin-top:8px;border-radius:10px;background:var(--s2);border:1px solid transparent;padding:0 12px;font-size:14px;outline:none}
.meta{font-size:12px;color:var(--dim);text-align:center;margin:18px 0 0}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:25;background:linear-gradient(transparent,var(--bg) 30%);padding:24px 0 calc(16px + env(safe-area-inset-bottom))}
.foot .wrap{display:flex;gap:10px}

/* detalhe */
.dx{display:flex;gap:12px;align-items:center;padding:14px}
.dx .info{flex:1;min-width:0}
.dx b{display:block;font-weight:700}
.dx small{color:var(--mut);font-size:13px;display:block}
.dx .sr{font-family:var(--fc);font-weight:700;color:var(--tx);font-size:18px;white-space:nowrap}

/* workout */
.prog{height:4px;background:var(--s2)}
.prog div{height:100%;background:var(--y);transition:width .3s}
.wx{margin-top:14px;padding:14px}
.wx-h{display:flex;gap:12px;align-items:center}
.wx-h .info{flex:1;min-width:0}
.wx-h b{display:block;font-weight:700;font-size:16px}
.wx-h small{color:var(--mut);font-size:13px}
.wx.done{border-color:var(--yt2)}
.note{margin-top:10px;font-size:13px;color:var(--mut);background:var(--s2);border-left:3px solid var(--y);padding:8px 10px;border-radius:6px}
.sets{margin-top:12px}
.set-h,.set{display:grid;grid-template-columns:40px 1fr 1fr 48px;gap:8px;align-items:center}
.set-h{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;font-weight:600;padding:0 0 6px}
.set-h span:nth-child(2),.set-h span:nth-child(3){text-align:center}
.set{margin-bottom:6px}
.sn{width:32px;height:32px;border-radius:8px;background:var(--s2);display:grid;place-items:center;font-weight:700;color:var(--mut);font-size:14px}
.set input{height:44px;border-radius:10px;background:var(--s2);border:1px solid transparent;text-align:center;font-weight:700;font-size:17px;outline:none;width:100%}
.set input:focus{border-color:var(--y)}
.chk{width:48px;height:44px;border-radius:10px;background:var(--s2);display:grid;place-items:center;color:var(--dim)}
.set.ok .chk{background:var(--y);color:var(--ytx)}
.set.ok .sn{background:var(--yt);color:var(--y)}
.set.ok input{color:var(--mut)}
.set-act{display:flex;justify-content:space-between}
.set-act .link.m{color:var(--mut)}

/* rest bar */
#rest{position:fixed;left:0;right:0;bottom:86px;z-index:40;pointer-events:none}
.rb{max-width:528px;margin:0 auto;background:#FFFFFF;border:1px solid var(--line);border-radius:14px;padding:7px 8px 7px 12px;display:flex;align-items:center;gap:8px;pointer-events:auto;box-shadow:0 12px 40px rgba(0,0,0,.6);position:relative;overflow:hidden}
.rb .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--y)}
.rb .t{font-family:var(--fc);font-weight:700;font-size:26px;color:var(--y);font-variant-numeric:tabular-nums;line-height:1;min-width:78px}
.rb .l{flex:1;min-width:0;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.rb.end{background:var(--y)}
.rb.end .t,.rb.end .l{color:var(--ytx)}
.rb button{height:36px;padding:0 10px;border-radius:9px;background:var(--s2);font-weight:700;font-size:13px}
.rb.end button{background:rgba(255,255,255,.18);color:var(--ytx)}
@media (max-width:600px){#rest{padding:0 16px}}

/* history */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:14px 12px}
.stat b{font-family:var(--fc);font-weight:700;font-size:30px;color:var(--tx);display:block;line-height:1}
.stat small{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.hs{padding:0;overflow:hidden}
.hs-h{display:flex;gap:12px;align-items:center;padding:14px;width:100%;text-align:left}
.hs-h .info{flex:1;min-width:0}
.hs-h b{display:block;font-weight:700}
.hs-h small{color:var(--mut);font-size:13px}
.hs-d{border-top:1px solid var(--line);padding:12px 14px}
.hs-ex{padding:6px 0}
.hs-ex b{font-weight:600;font-size:14px}
.hs-ex div{color:var(--mut);font-size:13px}
.chev{color:var(--dim);transition:transform .2s}
.open .chev{transform:rotate(180deg)}

/* overlay */
.ov{position:fixed;inset:0;z-index:60;background:rgba(27,30,28,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--s1);width:100%;max-width:560px;height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;border:1px solid var(--line);border-bottom:0}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:16px}
.sheet-h b{font-family:var(--fc);font-weight:700;font-size:22px;text-transform:none}
.sheet-b{flex:1;overflow-y:auto;padding:0 16px}
.sheet-f{padding:12px 16px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet-top{padding:0 16px}
.ov.c{align-items:center;padding:16px}
.dlg{background:var(--s1);border:1px solid var(--line);border-radius:18px;width:100%;max-width:400px;padding:20px;max-height:92vh;overflow-y:auto}
.dlg h3{font-family:var(--fc);font-weight:700;font-size:24px;text-transform:none;margin-bottom:6px}
.dlg p{color:var(--mut);margin-bottom:18px}
.dlg .row{display:flex;gap:10px}
.dlg .row .btn{flex:1}
.dlg label{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin:12px 0 6px}
.dlg select.inp{appearance:none}
.dlg .sub{font-family:var(--fc);font-weight:700;text-transform:none;color:var(--tx);font-size:15px;letter-spacing:-.01em;margin-top:18px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:80;background:var(--y);color:var(--ytx);font-weight:700;padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:opacity .3s;max-width:90vw;text-align:center}



/* foco no treino */
.wx{scroll-margin-top:84px}
.wx-t{display:flex;gap:12px;align-items:center;width:100%;text-align:left;min-width:0;flex:1}
.wx-t .info{flex:1;min-width:0}
.wx-t b{display:block;font-weight:700;font-size:16px}
.wx-t small{color:var(--mut);font-size:13px;display:block}
.wx.fut{padding:12px 14px;opacity:.75}
.wx.fut .gi{width:34px;height:34px}
.wx.cur{border-color:var(--y);box-shadow:0 0 0 1px var(--y) inset}
.now{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--y);color:var(--ytx);padding:3px 7px;border-radius:6px;flex:none}
.okb{width:26px;height:26px;border-radius:50%;background:var(--y);color:var(--ytx);display:grid;place-items:center;flex:none}
.last{margin-top:10px;font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.last b{color:var(--tx);font-weight:600}
.pr{color:var(--y);font-weight:800}
.sumg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 14px}
.sumg div{background:var(--s2);border-radius:12px;padding:10px}
.sumg b{display:block;font-family:var(--fc);font-weight:700;font-size:26px;color:var(--tx);line-height:1}
.sumg small{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.warn{background:var(--rt);color:#8E3E2B;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.prs{background:var(--yt);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.prs b{color:var(--y)}
@keyframes flashy{0%,100%{box-shadow:inset 0 0 0 0 transparent}50%{box-shadow:inset 0 0 0 8px var(--y)}}

/* perfil */
.av.f{background-size:cover;background-position:center;color:transparent}
.pf-top{display:flex;align-items:center;gap:16px;margin-top:18px}

.pf-av.f{color:transparent}
.pf-cam{position:absolute;right:-4px;bottom:-4px;width:34px;height:34px;border-radius:50%;background:var(--s3);border:2px solid var(--bg);display:grid;place-items:center;color:var(--y)}
.pf-top h2{font-family:var(--fc);font-weight:700;font-size:32px;text-transform:none;line-height:1}
.pf-top p{color:var(--mut);font-size:14px;margin-top:4px}
.pcard{padding:16px;margin-top:12px}
.pw{display:flex;align-items:flex-end;gap:10px}
.pw b{font-family:var(--fc);font-weight:700;font-size:46px;color:var(--tx);line-height:.9}
.pw span{color:var(--mut);font-size:14px;padding-bottom:4px}
.pw .dv{margin-left:auto;font-weight:700;font-size:14px;padding:4px 9px;border-radius:20px;background:var(--s2);color:var(--tx)}
.spark{width:100%;height:70px;margin-top:12px;display:block}
.plist{margin-top:10px;font-size:13px;color:var(--mut)}
.plist div{display:flex;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.plist div b{color:var(--tx);font-weight:600;margin-left:auto;margin-right:10px}
.plist button{color:var(--dim);width:26px;height:26px;display:grid;place-items:center}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fl{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin:0 0 6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{height:38px;padding:0 14px;border-radius:20px;background:var(--s2);color:var(--mut);font-weight:600;font-size:14px;border:1px solid transparent}
.opt.on{background:var(--y);color:var(--ytx)}
.ta{width:100%;min-height:84px;border-radius:12px;background:var(--s1);border:1px solid var(--line);padding:12px 14px;outline:none;resize:vertical;font:inherit;color:var(--tx)}
.ta:focus{border-color:var(--y)}
.pfgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.pfgrid div{background:var(--s2);border-radius:10px;padding:10px 12px}
.pfgrid small{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.pfgrid b{font-weight:700;font-size:15px}
.lim{margin-top:10px;background:var(--rt);border-left:3px solid var(--red);border-radius:8px;padding:10px 12px;font-size:14px}
.lim small{display:block;font-size:12px;color:#8E3E2B;text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:2px}
.hav{width:34px;height:34px;border-radius:50%;background:var(--y);color:var(--ytx);display:grid;place-items:center;font-family:var(--fc);font-weight:700;font-size:15px;background-size:cover;background-position:center;flex:none}
.hav.f{color:transparent}


/* ===== UI v2 ===== */
.nav button{font-size:11px}
.toast{top:auto;bottom:calc(96px + env(safe-area-inset-bottom))}
.capa.hoje{height:auto;min-height:290px}
.capa.hoje .tx{position:absolute;left:18px;right:18px;bottom:18px}
.capa.hoje .tx h2{font-family:var(--fc);font-weight:700;font-size:34px;line-height:1;text-transform:none;margin:6px 0 4px}
.capa.hoje .tx p{color:rgba(255,255,255,.85);font-size:14px;margin-bottom:14px}
.capa.hoje .sh{background:linear-gradient(180deg,rgba(11,11,12,.05) 10%,rgba(11,11,12,.55) 45%,rgba(11,11,12,.96) 82%)}
.tline{color:var(--mut);font-size:13px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day.off{opacity:.6}
.day.off .dn{padding:6px 0;background:transparent}
.day.off .dn b{font-size:16px}
.day.off .dc{padding:8px 14px}
.dx .vic{margin-left:2px}
.dobs{padding:0 14px 14px;font-size:13px;color:var(--mut)}
.set-h,.set{grid-template-columns:30px minmax(0,1.7fr) minmax(0,1fr) 56px}
.kg{display:flex;align-items:center;background:var(--s2);border-radius:10px;height:48px;overflow:hidden}
.kg input{background:transparent!important;height:48px!important;min-width:0;padding:0}
.kg button{width:30px;height:48px;flex:none;color:var(--mut);font-size:20px;font-weight:700;display:grid;place-items:center}
.kg button:active{background:var(--s3);color:var(--tx)}
.set input{height:48px;color:var(--tx)}
.set input::placeholder{color:#AAA59B;font-weight:600}
.set.ok input{color:var(--mut)}
.set.ok .kg{opacity:.7}
.sn{width:28px;height:28px;font-size:13px}
.chk{width:56px;height:48px;border-radius:12px;background:var(--yt);border:1.5px solid var(--yt2);color:var(--y)}
.set.ok .chk{border-color:var(--y)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.chk.pop{animation:pop .28s ease}
.cel{position:fixed;inset:0;z-index:90;display:grid;place-items:center;pointer-events:none;background:rgba(245,242,236,.94);animation:celfade 2.1s ease forwards}
.cel .st2{position:absolute;left:-20%;right:-20%;height:44px;background:repeating-linear-gradient(-55deg,var(--y) 0 22px,transparent 22px 44px)}
.cel .st2.a{top:28%;animation:slideL 2.1s ease}
.cel .st2.b{bottom:28%;animation:slideR 2.1s ease}
.cel b{font-family:var(--fc);font-weight:700;font-size:46px;text-transform:none;color:var(--tx);text-align:center;line-height:1;animation:zoom .5s ease}
.cel small{display:block;color:var(--y);font-size:14px;font-weight:700;letter-spacing:.1em;margin-top:8px;font-family:'Urbanist',system-ui,sans-serif}
@keyframes celfade{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes slideL{from{transform:translateX(30%)}to{transform:translateX(-10%)}}
@keyframes slideR{from{transform:translateX(-30%)}to{transform:translateX(10%)}}
@keyframes zoom{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}


/* ===== IDV marfim e verde ===== */
.capa .tx,.capa .tx b,.capa .tx h2{color:#FFFFFF}
.capa.capa .tx small{color:#D5E8DD;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.capa .tag-capa{color:rgba(255,255,255,.8);border-color:rgba(255,255,255,.4);background:rgba(0,0,0,.2)}
.capa.capa .tx b i{background:#D5E8DD}
.capa.hoje .btn.y{background:#F7F4EE;color:#1B1E1C}
.logo{gap:9px;letter-spacing:-.01em;font-size:25px;text-transform:none}
.logo svg{flex:none}
.login .logo{font-size:40px}
.login .logo svg{width:38px;height:38px}
.stripe{height:3px;width:44px;background:var(--y);border-radius:2px;opacity:1}
.card,.dlg,.sheet{box-shadow:0 1px 2px rgba(27,30,28,.04)}
.letter{background:var(--s2);color:var(--y)}
.btn.dark{background:var(--s3);color:var(--tx)}
.btn.ghost{background:transparent;border-color:var(--dim)}
.cel b{color:var(--tx)}
.cel small{color:var(--y)}
.cel .st2{background:repeating-linear-gradient(-55deg,var(--y) 0 22px,transparent 22px 44px)}
.toast{box-shadow:0 8px 24px rgba(27,30,28,.18)}
.rb{box-shadow:0 8px 24px rgba(27,30,28,.12)}
.av,.hav,.pf-av{background-color:var(--y);color:var(--ytx)}
.pf-av{border-color:var(--s1);box-shadow:0 0 0 2px var(--y)}
.day.today .dn small{color:var(--ytx)}
input[type=date]{color-scheme:light}


/* ===== ajustes iPhone ===== */
html,body{overflow-x:clip}
#app{overflow-x:clip}
.cel{overflow:hidden}
.cel .st2{left:0;right:0;width:140%;margin-left:-20%}
.nav{padding-bottom:env(safe-area-inset-bottom)}
#rest{bottom:calc(86px + env(safe-area-inset-bottom))}
.top{padding-top:env(safe-area-inset-top)}
.day.today.off{opacity:1}
.day.today.off .dn{background:var(--y);padding:10px 0}
.day.today.off .dn b,.day.today.off .dn small{color:var(--ytx)}


/* ===== evolução, check-in, mensagem ===== */
.poses{display:flex;gap:8px;margin-top:4px}
.cmp{position:relative;width:100%;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:var(--s2);margin-top:12px;touch-action:pan-y}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp .lado{position:absolute;bottom:10px;font-size:12px;font-weight:700;background:rgba(27,30,28,.65);color:#fff;padding:5px 9px;border-radius:8px}
.cmp .lado.a{left:10px}.cmp .lado.b{right:10px}
.cmp .div{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.15);pointer-events:none}
.cmp .div:after{content:"";position:absolute;top:50%;left:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.cmp input[type=range]{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:ew-resize}
.sel2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sel2 select{height:42px;font-size:14px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.thumbs button{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--s2)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs span{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:700;background:rgba(27,30,28,.6);color:#fff;padding:2px 6px;border-radius:6px}
.story{width:100%;border-radius:14px;display:block;box-shadow:0 6px 20px rgba(27,30,28,.18);margin:4px 0 14px}
.msgbox{white-space:pre-wrap;background:var(--s2);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45;max-height:42vh;overflow:auto;margin-bottom:14px}
.btn.wa{background:#1F7A4D;color:#fff}
.col{display:flex;flex-direction:column;gap:8px}


/* ===== tour ===== */
#tour{position:fixed;inset:0;z-index:95}
#tour .tv{position:fixed;inset:0;background:rgba(27,30,28,.62)}
#tour .hole{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(27,30,28,.62),0 0 0 3px var(--ytx),0 0 0 6px var(--y);transition:all .25s ease;pointer-events:none}
#tour .tb{position:fixed;left:16px;right:16px;max-width:420px;margin:0 auto;background:var(--s1);border-radius:18px;padding:18px 18px 14px;box-shadow:0 12px 40px rgba(0,0,0,.25);transition:top .25s ease,bottom .25s ease}
#tour .tb small{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--y);margin-bottom:6px}
#tour .tb h3{font-family:var(--fc);font-weight:700;font-size:24px;line-height:1.1;margin-bottom:6px}
#tour .tb p{color:var(--mut);font-size:15px;line-height:1.45}
#tour .tf{display:flex;align-items:center;gap:8px;margin-top:16px}
#tour .dots{display:flex;gap:5px;flex:1}
#tour .dots i{width:7px;height:7px;border-radius:50%;background:var(--s3)}
#tour .dots i.on{background:var(--y);width:18px;border-radius:4px}
#tour .mock{background:var(--bg);border-radius:12px;padding:10px;margin-top:12px;display:grid;grid-template-columns:24px 1.6fr 1fr 46px;gap:6px;align-items:center}
#tour .mock span{height:38px;border-radius:9px;background:var(--s1);display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-weight:700;font-size:15px}
#tour .mock .n{background:var(--s2);height:24px;justify-content:center;padding:0;font-size:12px;color:var(--mut)}
#tour .mock .ck{background:var(--y);color:var(--ytx);justify-content:center}
#tour .mock .k b{color:var(--mut);font-weight:700}
#tour ol{margin:10px 0 0 18px;color:var(--tx);font-size:15px;line-height:1.5}


/* ===== perfil do personal ===== */
.pcard .pp{display:flex;gap:14px;align-items:center}
.pp .pf-av{width:64px;height:64px;font-size:24px;border-width:2px}
.pp b{display:block;font-family:var(--fc);font-weight:700;font-size:20px;line-height:1.1}
.pp small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.pbio{margin-top:12px;font-size:14px;color:var(--tx);line-height:1.45}
.plinks{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.plinks a{flex:1;min-width:130px}


/* ===== carrossel de banners ===== */
.car{margin-top:14px}
.car-t{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;scrollbar-width:none;border-radius:16px;-webkit-overflow-scrolling:touch}
.car-t::-webkit-scrollbar{display:none}
.car-i{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:2/1;border-radius:16px;overflow:hidden;background:var(--s2);position:relative;display:block}
.car-i img{width:100%;height:100%;object-fit:cover;display:block}
.car-i .tg{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(245,242,236,.92);color:var(--tx);padding:3px 8px;border-radius:6px}
.car-d{display:flex;justify-content:center;gap:6px;margin-top:8px}
.car-d i{width:6px;height:6px;border-radius:3px;background:var(--s3);transition:all .2s}
.car-d i.on{width:18px;background:var(--y)}
.bn{display:flex;gap:10px;align-items:center;padding:10px;margin-top:8px}
.bn img{width:96px;aspect-ratio:2/1;object-fit:cover;border-radius:8px;flex:none}
.bn .info{flex:1;min-width:0}
.bn input{height:38px;font-size:13px;padding:0 10px}


/* ===== marca: selo + CARGA ===== */
.logo{gap:10px!important;font-size:19px!important;letter-spacing:0!important}
.logo span{font-family:var(--fc);font-weight:900;letter-spacing:.12em;line-height:1;color:var(--tx)}
.logo .selo{width:30px;height:30px;flex:none}
.login .logo{font-size:30px!important;gap:14px!important}
.login .logo .selo{width:48px;height:48px}


/* ===== cadastro de aluno ===== */
.cad .sec{margin-top:22px}
.cad .capa-up{position:relative;height:150px;border-radius:16px;overflow:hidden;background:var(--s2);border:1px dashed var(--dim);display:grid;place-items:center;color:var(--mut);font-weight:600;font-size:14px;width:100%}
.cad .capa-up img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cad .capa-up span{position:relative;background:rgba(245,242,236,.92);padding:6px 12px;border-radius:10px;color:var(--tx)}
.fase-box{padding:14px;margin-top:10px}
.mdl{display:block;width:100%;text-align:left;margin:0;padding:14px;border:1.5px solid var(--line)}
.mdl.on{border-color:var(--y);background:var(--yt)}
.mdl-h{display:flex;align-items:center;gap:8px}.mdl-h b{flex:1;font-size:15px}
.mdl-h i{font-style:normal;font-size:11px;font-weight:700;color:var(--y);background:var(--yt);padding:3px 8px;border-radius:6px;white-space:nowrap}
.mdl.on .mdl-h i{background:var(--s1)}
.mdl p{font-size:13px;color:var(--mut);margin-top:4px;line-height:1.4}.mdl small{display:block;font-size:12px;color:var(--dim);margin-top:6px;font-weight:600}
.fase-box h4{font-family:var(--fc);font-weight:700;font-size:17px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.fase-box h4 i{font-style:normal;font-size:12px;font-weight:700;color:var(--y);background:var(--yt);padding:3px 8px;border-radius:6px}
.step{display:flex;align-items:center;gap:10px;margin-top:12px}
.step button{width:38px;height:38px;border-radius:10px;background:var(--s2);font-size:20px;font-weight:700;color:var(--tx)}
.step b{min-width:92px;text-align:center;font-size:15px}
.cal{margin-top:12px;background:var(--s2);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5}
.cal b{color:var(--y)}
.tog{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;color:var(--tx)}
.tog input{width:20px;height:20px;accent-color:var(--y)}
.objs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.objs span{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--yt);color:var(--y);padding:3px 8px;border-radius:6px}

/* capa */
.capa{position:relative;height:200px;border-radius:18px;overflow:hidden;margin-top:16px;background:#2F5645 repeating-linear-gradient(-55deg,rgba(255,255,255,.03) 0 18px,transparent 18px 36px)}
.capa img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 8%}
.capa .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,12,0) 35%,rgba(11,11,12,.92))}
.capa .tx{position:absolute;left:18px;right:18px;bottom:16px}
.capa .tx small{display:block;font-size:12px;color:var(--y);text-transform:uppercase;letter-spacing:.12em;font-weight:700}
.capa .tx b{display:flex;align-items:center;gap:10px;font-family:var(--fc);font-weight:700;font-size:44px;line-height:1;text-transform:none}
.capa .tx b i{display:inline-block;width:12px;height:34px;background:var(--y);transform:skewX(-14deg);flex:none}
.capa .ini{position:absolute;right:-10px;top:-24px;font-family:var(--fc);font-weight:700;font-size:170px;line-height:1;color:rgba(255,255,255,.07)}
.capa .tag-capa{position:absolute;top:12px;right:12px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);border:1px dashed var(--s3);border-radius:8px;padding:4px 8px;background:rgba(11,11,12,.6)}

/* painel */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{padding:14px 12px}
.kpi b{font-family:var(--fc);font-weight:700;font-size:32px;color:var(--tx);display:block;line-height:1}
.kpi b.r{color:var(--red)}
.kpi small{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.ac{padding:16px;width:100%;text-align:left;display:block}
.ac:active{background:var(--s2)}
.ac-h{display:flex;align-items:center;gap:12px}
.av{width:46px;height:46px;border-radius:50%;background:var(--y);color:var(--ytx);display:grid;place-items:center;font-family:var(--fc);font-weight:700;font-size:20px;flex:none}
.ac-h .info{flex:1;min-width:0}
.ac-h b{display:block;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-h small{color:var(--mut);font-size:13px}
.st{font-size:12px;padding:4px 9px;border-radius:20px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;flex:none}
.st.ok{background:var(--yt);color:var(--y)}
.st.warn{background:var(--rt);color:var(--red)}
.st.neu{background:var(--s2);color:var(--mut)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:14px}
.wk div{text-transform:none!important;text-align:center;font-size:12px;color:var(--dim);font-weight:700;text-transform:uppercase}
.wk i{display:block;height:26px;border-radius:7px;background:var(--s2);margin-bottom:4px;border:1px solid transparent}
.wk i.plan{border-color:var(--s3);border-style:dashed}
.wk i.done{background:var(--y)}
.wk i.today{outline:1px solid var(--mut);outline-offset:1px}
.ac-f{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px;color:var(--mut)}
.ac-f b{color:var(--tx);font-weight:600}
.ac-f .up{color:var(--y);font-weight:700}
.pbar{height:6px;border-radius:3px;background:var(--s2);margin-top:12px;overflow:hidden}
.pbar div{height:100%;background:var(--y)}
.selbar{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-top:14px;border-radius:12px;background:var(--s1);border:1px solid var(--line);width:100%;text-align:left}
.selbar .av{width:34px;height:34px;font-size:15px}
.selbar .info{flex:1;min-width:0}
.selbar small{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.selbar b{font-weight:700}
.list-a .ei{cursor:pointer}
.gen{font-size:13px;color:var(--y);font-weight:600;margin-top:6px;display:inline-block}
.loading{color:var(--mut);text-align:center;padding:60px 16px}
@media (max-width:480px){.sync span{display:none}.top-in{gap:8px}.logo{font-size:23px}}

async function flush(k){
  if(cloud.busy[k]){cloud.pend[k]=true;return}
  const d=dados(k); if(!d) return;
  cloud.busy[k]=true;
  try{ if(FB) await fbSet(k,d); else await db.doc(caminho(k)).set(clone(d)); setSync('ok') }
  catch(e){ setSync('err'); toast(k.startsWith('hist:')?'Não foi possível salvar o treino na nuvem':'Não foi possível salvar na nuvem') }
  cloud.busy[k]=false;
  if(cloud.pend[k]){cloud.pend[k]=false;flush(k)}
}

async function ler(k){
  if(cloud.on&&FB) return fbGet(k);
  if(cloud.on){ const s=await db.doc(caminho(k)).get(); return s.exists&&s.data()?clone(s.data()):null }
  if(k.startsWith('prog:')||k==='alunos'||k==='bib') return EMBED[k]?clone(EMBED[k]):lsGet(k,null);
  return lsGet(k,null);
}
function ouvir(k,aplica){
  if(!cloud.on||cloud.subs[k]) return;
  if(FB){try{const r=fbRef(k);cloud.subs[k]=true;r.doc.onSnapshot(snap=>{try{if(cloud.busy[k]||snap.metadata.hasPendingWrites)return;const v=snap.exists&&snap.data()[r.field];if(v)aplica(clone(v))}catch(e){}})}catch(e){}return}
  try{const r=db.doc(caminho(k));if(typeof r.onSnapshot==='function'){cloud.subs[k]=true;r.onSnapshot(snap=>{try{if(cloud.busy[k])return;if(snap&&snap.exists&&snap.data()) aplica(clone(snap.data()))}catch(e){}})}}catch(e){}
}

async function carregaSessao(){
  if(!SES){render();return}

  carregando=true; render();

    await Promise.all(ids.map(async id=>{
      const [p,h,u]=await Promise.all([ler('prog:'+id),ler('hist:'+id),ler('perfil:'+id)]);
      PROG[id]=p||progVazio(); fixaProg(PROG[id]); HIST[id]=h||histVazio(); PERF[id]={...perfVazio(),...(u||{})};

      ids.forEach(id=>ouvir('perfil:'+id,d=>{PERF[id]={...perfVazio(),...d};if(ui.view!=='editor')render()}));

    } else {
      const id=SES.alunoId;
      ouvir('prog:'+id,d=>{PROG[id]=d;foco(id);if(ui.view!=='treino')render()});

  }catch(e){ toast('Erro ao carregar os dados') }

  else { if(!alunoById(ui.alunoSel)) ui.alunoSel=null; foco(ui.alunoSel); if(!ui.alunoSel) ui.tab='painel'; }

}

const FB=!!window.FB_CFG;
let fs=null, fauth=null, fuser=null;
const ALFA='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function gerarCodigo(){const a=new Uint32Array(8);crypto.getRandomValues(a);const c=[...a].map(n=>ALFA[n%ALFA.length]).join('');return c.slice(0,4)+'-'+c.slice(4)}
const limpaCod=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
async function keyDe(c){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('carga:'+limpaCod(c)));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function fbRef(k){
  if(k==='perfilP') return {doc:fs.collection('publico').doc('personal'),field:'perfil'};
  if(k==='alunos') return {doc:fs.collection('personal').doc(fuser.uid),field:'alunos'};
  if(k==='bib') return {doc:fs.collection('publico').doc('bib'),field:'bib'};
  if(k.startsWith('prog:')) return {doc:fs.collection('contas').doc(k.slice(5)),field:'prog'};
  if(k.startsWith('perfil:')) return {doc:fs.collection('registros').doc(k.slice(7)),field:'perfil'};
  return {doc:fs.collection('registros').doc(k.slice(5)),field:'hist'};
}
function alunosParaSalvar(){const a=clone(ALU);a.lista.forEach(x=>delete x.capa);return a}
async function fbGet(k){const r=fbRef(k);const sn=await r.doc.get();const v=sn.exists?sn.data()[r.field]:null;return v?clone(v):null}
async function fbSet(k,d){const r=fbRef(k);await r.doc.set({[r.field]:clone(k==='alunos'?alunosParaSalvar():d)},{merge:true});
  if(k==='alunos') await Promise.all(ALU.lista.map(a=>fs.collection('contas').doc(a.id).set({nome:a.nome},{merge:true})))}
async function fbInit(){
  firebase.initializeApp(window.FB_CFG);
  fs=firebase.firestore();
  try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
  fauth=firebase.auth();
  fuser=await new Promise(r=>{const off=fauth.onAuthStateChanged(u=>{off();r(u)})});
  cloud.on=true; setSync('ok');
  if(SES&&SES.papel==='personal'){
    let ok=false; if(fuser){try{await fbPersonal();ok=true}catch(e){}}
    if(!ok){SES=null;lsSet('sessao',null);ui.loginP=true}
  } else if(SES&&SES.papel==='aluno'){
    let ok=false;
    if(/^[0-9a-f]{64}$/.test(String(SES.alunoId))){try{ok=await fbAluno(SES.alunoId)}catch(e){ok=false}}
    if(!ok){SES=null;lsSet('sessao',null);ui.loginErr='O app foi atualizado. Digite o código novo que seu personal te mandou.'}
  }
  ready=true; await carregaSessao();
}
async function fbPersonal(){
  let a=await fbGet('alunos');
  if(!a) a=await fbSemear();
  ALU=a; fixaBase();
  BIB=(await fbGet('bib'))||BIB; fixaBase();
  try{PP={...PP,...((await fbGet('perfilP'))||{})}}catch(e){}
  await carregaBanners(true);
  await fbMigrarCodigos();

}
async function fbAluno(key){
  const sn=await fs.collection('contas').doc(key).get();
  if(!sn.exists||sn.data().movidoPara) return false;
  const d=sn.data();
  ALU={personal:{codigo:''},lista:[{id:key,nome:d.nome||'Aluno',capa:d.capa||''}]};
  BIB=(await fbGet('bib'))||BIB; fixaBase();
  try{PP={...PP,...((await fbGet('perfilP'))||{})}}catch(e){}
  await carregaBanners(false);
  await migrarLocal(key);
  return true;
}
async function fbSemear(){ // primeira vez: leva o programa e a Laura pro Firebase
  const E=(typeof EMBED!=='undefined'&&EMBED)||{}, base=(E.alunos&&E.alunos.lista)||[];
  const lista=[];
  for(const x of base){
    const codigo=gerarCodigo(), id=await keyDe(codigo);
    lista.push({id,nome:x.nome,codigo,whats:'',criadoEm:x.criadoEm||Date.now()});
    await fs.collection('contas').doc(id).set({nome:x.nome,capa:x.capa||'',prog:clone(E['prog:'+x.id]||progVazio())});
  }
  const a={personal:{codigo:''},lista};
  await fs.collection('personal').doc(fuser.uid).set({alunos:a});
  if(E.bib) await fs.collection('publico').doc('bib').set({bib:clone(E.bib)});
  return a;
}
async function migrarLocal(key){ // histórico, perfil e fotos da versão anterior (só neste aparelho)
  try{
    const ant=['a1'];
    for(const old of ant){
      const h=lsGet('hist:'+old,null), u=lsGet('perfil:'+old,null);
      if(h||u){
        const sn=await fs.collection('registros').doc(key).get();const cur=sn.exists?sn.data():{};
        const up={};
        if(h&&(!cur.hist||!(cur.hist.sessoes||[]).length)) up.hist=clone(h);
        if(u&&!cur.perfil) up.perfil=clone(u);
        if(Object.keys(up).length) await fs.collection('registros').doc(key).set(up,{merge:true});
        lsSet('hist:'+old,null); lsSet('perfil:'+old,null);
      }

    }

/* ============ MÉTRICAS ============ */
function metricas(id){
  const p=PROG[id]||progVazio(), h=HIST[id]||histVazio();
  const ativos=(p.treinos||[]).filter(t=>!t.fase||t.fase===(p.faseAtiva||1));
  const diasPlan=new Set(); ativos.forEach(t=>t.dias.forEach(d=>diasPlan.add(d)));
  const ini=inicioSemana();
  const semana=h.sessoes.filter(s=>s.data>=ini);
  const diasFeitos=new Set(semana.map(s=>new Date(s.data).getDay()));
  const ult=h.sessoes[0]||null;
  // evolução de carga: maior ganho entre o primeiro e o último registro de um exercício
  const reg={};
  [...h.sessoes].reverse().forEach(s=>s.itens.forEach(i=>{const c=Math.max(0,...i.series.map(x=>num(x.carga)));if(c>0){(reg[i.exId]=reg[i.exId]||{nome:i.nome,ini:c,fim:c}).fim=c}}));
  let destaque=null; Object.values(reg).forEach(r=>{const g=r.fim-r.ini;if(g>0&&(!destaque||g>destaque.g))destaque={...r,g}});
  let status;
  if(!ativos.length) status={t:'Sem programa',c:'neu'};
  else if(!ult) status={t:'Ainda não treinou',c:'neu'};
  else if(diasDesde(ult.data)>=5) status={t:'Sumido · '+diasDesde(ult.data)+' dias',c:'warn'};
  else status={t:'Em dia',c:'ok'};
  return {p,h,ativos,diasPlan,semana,diasFeitos,ult,destaque,status,planSemana:diasPlan.size,feitosSemana:semana.length,atencao:status.c==='warn'};
}

const fdb={db:null,
  open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{try{const r=indexedDB.open('carga-fotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('fotos',{keyPath:'id'});r.onsuccess=()=>{this.db=r.result;res(r.result)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('fotos',mode),st=t.objectStore('fotos');const r=fn(st);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})},
  all(){return this.tx('readonly',st=>st.getAll())},put(o){return this.tx('readwrite',st=>st.put(o))},del(id){return this.tx('readwrite',st=>st.delete(id))}
};

function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function logoCanvas(ctx,x,y,s){ctx.fillStyle='#2F5645';rr(ctx,x,y,s,s,s*.26);ctx.fill();const k=s/64*1.04,ox=x+s*10.2/64,oy=y+s*10.2/64;ctx.strokeStyle='#F5F2EC';ctx.lineWidth=9.5*k;ctx.lineCap='round';ctx.beginPath();ctx.arc(ox+21*k,oy+21*k,15*k,-0.6696,0.6696,true);ctx.stroke();ctx.fillStyle='#F5F2EC';ctx.beginPath();ctx.arc(ox+21*k,oy+21*k,4.2*k,0,7);ctx.fill()}
async function gerarStory(sess,foto){

  x.fillStyle='#F5F2EC';x.fillRect(0,0,W,Hh);
  const px=56,py=56,pw=W-112,ph=1290;
  x.save();rr(x,px,py,pw,ph,44);x.clip();
  if(foto){const im=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=foto});const k=Math.max(pw/im.width,ph/im.height),w=im.width*k,h=im.height*k;x.drawImage(im,px+(pw-w)/2,py+(ph-h)/2,w,h);
    const g=x.createLinearGradient(0,py+ph*.6,0,py+ph);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.45)');x.fillStyle=g;x.fillRect(px,py,pw,ph)}
  else{x.fillStyle='#2F5645';x.fillRect(px,py,pw,ph);x.strokeStyle='rgba(255,255,255,.05)';x.lineWidth=40;for(let i=-ph;i<pw+ph;i+=110){x.beginPath();x.moveTo(px+i,py);x.lineTo(px+i-ph*.7,py+ph);x.stroke()}
    x.fillStyle='rgba(255,255,255,.10)';x.font=F(800,620);x.textAlign='center';x.textBaseline='middle';x.fillText(sess.letra||'C',px+pw/2,py+ph/2+20)}
  x.restore();
  // selo no topo da foto
  x.font=F(700,34);const selo='TREINO CONCLUÍDO';const sw=x.measureText(selo).width+64;x.fillStyle='rgba(245,242,236,.94)';rr(x,px+36,py+36,sw,72,36);x.fill();
  x.fillStyle='#2F5645';x.textAlign='left';x.textBaseline='middle';x.fillText(selo,px+68,py+73);
  if(sess.prs&&sess.prs.length){x.font=F(700,36);const t='🔥 Recorde: '+sess.prs[0].nome+' '+sess.prs[0].c+' kg';const tw=Math.min(pw-72,x.measureText(t).width+60);x.fillStyle='#2F5645';rr(x,px+36,py+ph-112,tw,76,38);x.fill();x.fillStyle='#F7F4EE';x.fillText(t,px+66,py+ph-73,tw-60)}
  // painel de baixo
  const by=py+ph+70;
  logoCanvas(x,px,by-4,60);x.fillStyle='#1B1E1C';x.font=F(900,40);x.textBaseline='middle';x.textAlign='left';try{x.letterSpacing='5px'}catch(e){}x.fillText('CARGA',px+78,by+27);try{x.letterSpacing='0px'}catch(e){}
  x.font=F(600,34);x.fillStyle='#6B6860';x.textAlign='right';x.fillText(new Date(sess.data).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'}),W-px,by+28);
  x.textAlign='left';x.fillStyle='#1B1E1C';x.font=F(700,84);let nome=sess.nome||'Treino';while(x.measureText(nome).width>pw&&nome.length>4)nome=nome.slice(0,-2);if(nome!==sess.nome)nome=nome.trim()+'…';

  const st=[[String(nS),'séries'],[fmtDur(sess.dur),'de treino'],[vol?Math.round(vol).toLocaleString('pt-BR'):String(sess.itens.length),vol?'kg levantados':'exercícios']];
  st.forEach(([v,l],i)=>{const cx=px+i*(pw/3);x.fillStyle='#2F5645';x.font=F(700,64);x.fillText(v,cx,by+260);x.fillStyle='#6B6860';x.font=F(600,32);x.fillText(l,cx,by+318)});

}

let BANNERS=[]; // [{id,img,link}]
async function carregaBanners(semear){
  try{
    if(FB&&fs){
      const ix=await fs.collection('publico').doc('banners').get();
      if(!ix.exists){ if(semear){await semeiaBanners()} return }
      const lista=(ix.data().lista)||[];
      const imgs=await Promise.all(lista.map(b=>fs.collection('publico').doc('banner_'+b.id).get().then(d=>d.exists?d.data().img:'').catch(()=>'')));
      BANNERS=lista.map((b,i)=>({...b,img:imgs[i]})).filter(b=>b.img);
      if(semear){const E=(typeof EMBED!=='undefined'&&EMBED.banners)||[], ja=new Set(ix.data().semeados||lista.map(b=>b.id));
        const novos=E.filter(b=>!ja.has(b.id));
        if(novos.length){BANNERS.push(...novos.map(b=>({...b})));await Promise.all(novos.map(b=>fs.collection('publico').doc('banner_'+b.id).set({img:b.img})));await salvaBanners()}}
    } else if(cloud.on&&db){
      const d=await db.doc('plano/banners').get(); BANNERS=d.exists&&d.data()?(d.data().lista||[]):[];
    } else BANNERS=lsGet('banners',null)||((typeof EMBED!=='undefined'&&EMBED.banners)||[]);
  }catch(e){}
}
async function semeiaBanners(){
  const E=(typeof EMBED!=='undefined'&&EMBED.banners)||[];
  BANNERS=E.map(b=>({...b}));
  await salvaBanners(true);
}
async function salvaBanners(tudo,novo){
  try{
    if(FB&&fs){
      if(tudo) await Promise.all(BANNERS.map(b=>fs.collection('publico').doc('banner_'+b.id).set({img:b.img})));
      else if(novo) await fs.collection('publico').doc('banner_'+novo.id).set({img:novo.img});
      const E=(typeof EMBED!=='undefined'&&EMBED.banners)||[];
      await fs.collection('publico').doc('banners').set({lista:BANNERS.map(b=>({id:b.id,link:b.link||''})),semeados:E.map(b=>b.id)});
    } else if(cloud.on&&db){ await db.doc('plano/banners').set({lista:clone(BANNERS)}) }

function treinosDoModelo(m){const now=Date.now();
  return (m.treinos||[]).map(t=>Array.isArray(t)
    ?{id:uid(),letra:t[0],nome:t[1],fase:t[2]||0,dias:[...t[3]],criadoPor:'personal',criadoEm:now,atualizadoEm:now,exercicios:t[4].map(x=>({uid:uid(),exId:x[0],series:x[1],reps:x[2],carga:'',descanso:x[3],obs:x[4]||''}))}
    :{...clone(t),id:uid(),criadoPor:'personal',criadoEm:now,atualizadoEm:now,exercicios:(t.exercicios||[]).map(x=>({...x,uid:uid(),carga:''}))})}
const faseDoModelo=(m,n)=>{const f=(m.fases||{})[String(n)]||{};const tipo=f.tipo||'Personalizada';return {tipo,custom:tipo==='Personalizada'?(f.nome||''):'',semanas:+f.semanas||2,nota:f.nota!==undefined?f.nota:(TIPOS_FASE[tipo]||'')}};
const resumoModelo=m=>{const ts=m.treinos||[];const nEx=ts.reduce((a,t)=>a+(Array.isArray(t)?t[4]:t.exercicios||[]).length,0);return `${ts.length} treino${ts.length===1?'':'s'} · ${nEx} exercícios${m.freq?' · '+m.freq:''}`};
function aplicarModelo(p,m,modo){
  const novos=treinosDoModelo(m);
  if(modo==='somar'){const usadas=new Set(p.treinos.map(t=>t.letra));const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';novos.forEach(t=>{if(usadas.has(t.letra)){const l=[...L].find(x=>!usadas.has(x));if(l)t.letra=l}usadas.add(t.letra)});p.treinos=p.treinos.concat(novos)}
  else{p.treinos=novos;p.fases=p.fases||{};[1,2].forEach(n=>{const f=faseDoModelo(m,n);p.fases[String(n)]={tipo:f.tipo,nome:f.tipo==='Personalizada'?(f.custom||'Fase '+n):f.tipo,sub:'',nota:f.nota,semanas:f.semanas}});fixaProg(p)}
}
function salvarModeloDe(p,nome,desc){
  BIB.modelos=BIB.modelos||[];

    fases:{'1':{...pick(p.fases&&p.fases['1'])},'2':{...pick(p.fases&&p.fases['2'])}},
    treinos:p.treinos.map(t=>({letra:t.letra,nome:t.nome,fase:t.fase||0,dias:[...(t.dias||[])],exercicios:t.exercicios.map(x=>({exId:x.exId,series:x.series,reps:x.reps,descanso:x.descanso,obs:x.obs||''}))}))};
  function pick(f){f=f||{};return {tipo:f.tipo||(TIPOS_FASE[f.nome]!==undefined?f.nome:'Personalizada'),nome:f.nome||'',nota:f.nota||'',semanas:+f.semanas||2}}
  BIB.modelos.push(m); persist('bib'); return m;
}

async function salvarCadastro(){
  const c=ui.cad, nome=String(c.nome).trim(), cod=String(c.codigo).trim().toUpperCase();
  if(!nome) return toast('Digite o nome do aluno');
  if(!codigoLivre(cod,c.id)) return toast('Esse código já está em uso');
  const fase=n=>{const f=c['f'+n];return {tipo:f.tipo,nome:f.tipo==='Personalizada'?(String(f.custom).trim()||'Fase '+n):f.tipo,sub:'',nota:String(f.nota||'').trim(),semanas:f.semanas}};
  const aplica=p=>{p.fases=p.fases||{};p.fases['1']=fase(1);p.fases['2']=fase(2);p.inicio=c.inicio||'';p.autoFase=!!c.auto;if(!p.inicio)delete p.inicio;fixaProg(p)};
  let id=c.id;
  if(id){
    const a=alunoById(id); a.nome=nome; a.whats=String(c.whats||'').trim(); a.objetivos=[...c.objetivos]; if(!FB)a.codigo=cod;
    if(c.capaNova) a.capa=c.capa;
    const p=PROG[id]||(PROG[id]=progVazio()); aplica(p);
    persist('alunos'); persist('prog:'+id);
  } else {
    id=FB?await keyDe(cod):'a'+uid();
    let p=progVazio();
    if(c.modelo&&modeloById(c.modelo)){p.treinos=treinosDoModelo(modeloById(c.modelo))}
    else if(c.base&&PROG[c.base]){p=clone(PROG[c.base]);p.faseAtiva=1;p.treinos.forEach(t=>{t.id=uid();t.atualizadoEm=Date.now();t.exercicios.forEach(x=>{x.uid=uid();x.carga=''})})}
    aplica(p); PROG[id]=p; HIST[id]=histVazio();
    ALU.lista.push({id,nome,codigo:cod,whats:String(c.whats||'').trim(),objetivos:[...c.objetivos],criadoEm:Date.now(),capa:c.capa||''});
    persist('alunos'); persist('prog:'+id); persist('hist:'+id);
    ouvir('hist:'+id,d=>{HIST[id]=d;fixaHist(d);if(ui.alunoSel===id)foco(id);if(ui.view!=='editor')render()});
  }
  if(c.capaNova&&FB&&fs){try{await fs.collection('contas').doc(id).set({capa:c.capa||''},{merge:true})}catch(e){toast('Não foi possível salvar a foto')}}
  const novo=!c.id; ui.cad=null;
  acts.abrirAluno({id});
  if(novo){ui.modal={tipo:'msgAluno',id,novo:true};renderOv()} else toast('Aluno atualizado');
}

/* ============ ALUNO TROCA O PRÓPRIO CÓDIGO (Firebase) ============ */
async function trocarCodigoAluno(novo){
  const c=limpaCod(novo), old=SES.alunoId;
  if(c.length<6) return 'Use pelo menos 6 letras ou números.';
  const nk=await keyDe(c);
  if(nk===old) return 'Esse já é o seu código.';
  const ref=id=>fs.collection('contas').doc(id), reg=id=>fs.collection('registros').doc(id);
  if((await ref(nk).get()).exists) return 'Esse código já está em uso. Escolha outro.';
  const od=(await ref(old).get()).data()||{};
  const nd={...od,de:old,codigo:c}; delete nd.movidoPara;
  await ref(nk).set(nd);
  const rs=await reg(old).get(); const rd=rs.exists?rs.data():{};
  const up={}; if(rd.hist)up.hist=rd.hist; if(rd.perfil)up.perfil=rd.perfil;
  await reg(nk).set(Object.keys(up).length?up:{hist:{sessoes:[],ultimas:{}}});
  await ref(old).set({movidoPara:nk},{merge:true});
  // leva o que é só deste aparelho junto
  try{const t=await fdb.all();for(const f of (t||[])) if(f.alunoId===old){f.alunoId=nk;await fdb.put(f)}}catch(e){}
  if(lsGet('tourOk:'+old,false)) lsSet('tourOk:'+nk,true);
  PROG[nk]=PROG[old];HIST[nk]=HIST[old];PERF[nk]=PERF[old];
  ALU.lista[0].id=nk; SES.alunoId=nk; lsSet('sessao',SES); FOTOS=null; cloud.subs={};
  ouvir('prog:'+nk,d=>{PROG[nk]=d;foco(nk);if(ui.view!=='treino')render()});
  foco(nk);
  return null;
}

  let mudou=false;
  for(const x of ALU.lista){
    try{
      let sn=await fs.collection('contas').doc(x.id).get(), passos=0;
      while(sn.exists&&sn.data().movidoPara&&passos<5){
        const velho=x.id, nk=sn.data().movidoPara;
        const ns=await fs.collection('contas').doc(nk).get(); if(!ns.exists)break;
        x.id=nk; if(ns.data().codigo)x.codigo=ns.data().codigo; mudou=true;
        try{await fs.collection('contas').doc(velho).delete();await fs.collection('registros').doc(velho).delete()}catch(e){}
        sn=ns; passos++;
      }
    }catch(e){}
  }
  if(mudou){await fbSet('alunos',ALU)}
}

function sugereCodigo(nome){
  if(FB) return gerarCodigo();
  const base=norm(nome).replace(/[^a-z]/g,'').slice(0,6).toUpperCase()||'ALUNO';
  for(let i=0;i<50;i++){const c=base+String(Math.floor(1000+Math.random()*9000));if(codigoLivre(c))return c}
  return base+uid().slice(0,4).toUpperCase();
}
function codigoLivre(c,exceto){
  const n=norm(c); if(!n) return false;
  if(n===norm(ALU.personal.codigo)) return false;
  return !ALU.lista.some(a=>a.id!==exceto&&norm(a.codigo)===n);
}

function render(){
  let h;
  if(!SES) h=vLogin();
  else if(carregando||!ready) h='<div class="loading">Carregando…</div>';
  else if(ui.view==='editor'&&isP()) h=vEditor();
  else if(ui.view==='aluno'&&isP()) h=vAluno();
  else if(ui.view==='perfilP'&&isP()) h=vPerfilPersonal();
  else if(ui.view==='cadastro'&&isP()) h=vCadastro();
  else if(ui.view==='detalhe') h=vDetalhe();
  else if(ui.view==='treino') h=vTreino();
  else {
    if(!isP()&&(ui.tab==='biblioteca'||ui.tab==='painel')) ui.tab='treinos';
    if(isP()&&(ui.tab==='perfil'||ui.tab==='evolucao')) ui.tab='painel';
    h=vHeader()+({painel:vPainel,treinos:vTreinos,semana:vSemana,biblioteca:vBiblioteca,historico:vHistorico,perfil:vPerfil,evolucao:vEvolucao}[ui.tab])()+vNav();
  }
  if(h===undefined) return;
  $('#app').innerHTML=h;
  renderOv(); renderRest(); if(ui.tour!=null) setTimeout(renderTour,0);
}
function renderOv(){$('#ov').innerHTML=(ui.picker?vPicker():'')+(ui.modal?vModal():'')}
function confirmar(o,fn){ui.modal=o;modalFn=fn;renderOv()}
async function montaStory(foto){
  const m=ui.modal;if(!m)return;const sess=H.sessoes.find(s=>s.id===m.sid);if(!sess){ui.modal=null;renderOv();return}
  m.gerando=true;renderOv();
  try{const b=await gerarStory(sess,foto);if(m.url)URL.revokeObjectURL(m.url);m.blob=b;m.url=URL.createObjectURL(b)}catch(e){toast('Não consegui montar a imagem')}
  m.gerando=false;if(ui.modal===m)renderOv();
}
function celebrar(sub){const el=document.createElement('div');el.className='cel';el.innerHTML=`<div class="st2 a"></div><div class="st2 b"></div><div><b>Treino<br>concluído</b><small>${esc(sub)}</small></div>`;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}

  if(isP()) return;
  const t=tById(id); if(!t) return;
  const go=()=>{
    A={treinoId:t.id,letra:t.letra,nome:t.nome,inicio:Date.now(),itens:t.exercicios.map(x=>({exId:x.exId,reps:x.reps,descanso:+x.descanso||60,obs:x.obs,
      series:Array.from({length:Math.max(1,+x.series||1)},(_,j)=>{const lv=ultimaVez(x.exId);return {carga:'',reps:'',sc:String(x.carga||(lv&&lv[j]&&lv[j].carga)||H.ultimas[x.exId]||''),sr:(String(x.reps).match(/\d+/)||[''])[0],feito:false}})}))};
    lsSet('ativa',A); ui.view='treino'; ui.rest=null; ui.wxOpen=[]; window.scrollTo(0,0); render();
  };
  if(A && A.treinoId!==id) confirmar({titulo:'Treino em andamento',texto:`Você tem o treino "${A.nome}" em andamento. Descartar e começar este?`,ok:'Começar novo',perigo:true},go);
  else if(A){ui.view='treino';render()} else go();
}

let actx=null;
function audioOn(){try{if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C()}if(actx&&actx.state==='suspended')actx.resume()}catch(e){}}
function bipe(){try{if(!actx)return;const t0=actx.currentTime;[0,.22,.44].forEach((d,k)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=k===2?1175:880;g.gain.setValueAtTime(.0001,t0+d);g.gain.exponentialRampToValueAtTime(.35,t0+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d+.18);o.connect(g);g.connect(actx.destination);o.start(t0+d);o.stop(t0+d+.2)})}catch(e){}}
function alertaFim(){bipe();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}document.body.classList.remove('flash');void document.body.offsetWidth;document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),2000)}
document.addEventListener('click',e=>{
  audioOn();
  const el=e.target.closest('[data-a]'); if(!el) return;
  if(el.dataset.self && e.target!==el) return;
  if(el.disabled) return;
  e.preventDefault();
  const f=acts[el.dataset.a]; f&&f(el.dataset,el);
});

  if(f==='set'){A.itens[+el.dataset.i].series[+el.dataset.s][el.dataset.k]=el.value;lsSet('ativa',A);return}
  if(f==='cadBase'&&ui.cad){ui.cad.base=el.value;if(el.value){ui.cad.modelo='';document.querySelectorAll('.mdl.on').forEach(b=>b.classList.remove('on'))}return}
  if(f==='cad'&&ui.cad){ui.cad[el.dataset.k]=el.value;if(el.dataset.k==='inicio'){const c=$('#cadCal');if(c)c.innerHTML=calTexto()}return}
  if(f==='cadF'&&ui.cad){ui.cad['f'+el.dataset.n][el.dataset.k]=el.value;if(el.dataset.k==='custom'){const c=$('#cadCal');if(c)c.innerHTML=calTexto()}return}
  if(f==='cadAuto'&&ui.cad){ui.cad.auto=el.checked;const c=$('#cadCal');if(c)c.innerHTML=calTexto();return}
  if(f==='bnLink'&&isP()){const b=BANNERS[+el.dataset.i];if(b){b.link=el.value.trim();clearTimeout(window.__bnT);window.__bnT=setTimeout(()=>salvaBanners(),800)}return}
  if(f==='pp'&&isP()){PP[el.dataset.k]=el.value;persist('perfilP');const h=document.querySelector('.pf-top h2');if(h&&el.dataset.k==='nome')h.textContent=ppNome();return}
  if(f==='cmp'){ui.cmpPos=+el.value;const b=$('#cmpB'),dv=$('#cmpDiv');if(b)b.style.clipPath=`inset(0 0 0 ${el.value}%)`;if(dv)dv.style.left=el.value+'%';return}
  if(f==='cmpA'||f==='cmpB'){ui[f]=el.value;render();return}
  if(f==='pf'&&!isP()){const id=SES.alunoId;PERF[id][el.dataset.k]=el.value;persist('perfil:'+id);return}
  if(f==='nomeNovo'){const c=$('#codNovo');if(c&&(!c.value||c.dataset.auto==='1')){c.value=el.value.trim()?sugereCodigo(el.value):'';c.dataset.auto='1'}return}
  if(!isP()) return;
  const t=tById(ui.editId); if(!t||ui.view!=='editor') return;
  if(f==='nome') t.nome=el.value;
  else if(f==='letra') t.letra=el.value.toUpperCase();
  else if(f==='ex'){const x=t.exercicios.find(x=>x.uid===el.dataset.u);if(x)x[el.dataset.k]=el.value}
  tocar(t);
});
document.addEventListener('change',async e=>{
  if(e.target.dataset&&e.target.dataset.f==='cadAuto'&&ui.cad){ui.cad.auto=e.target.checked;const c=$('#cadCal');if(c)c.innerHTML=calTexto();return}
  if(e.target.id==='fotoEvo'&&e.target.files&&e.target.files[0]){
    const m=ui.modal, fm=$('#fFoto'), dt=fm?new Date(fm.data.value+'T12:00').getTime():Date.now();
    try{const img=await comprimir(e.target.files[0],1000,.8);const pf=PERF[SES.alunoId],pa=pf&&pesoAtual(pf);
      const f={id:uid(),alunoId:SES.alunoId,pose:(m&&m.pose)||'Frente',data:isNaN(dt)?Date.now():dt,img,peso:pa?pa.kg:''};
      await fdb.put(f);FOTOS.push(f);FOTOS.sort((a,b)=>a.data-b.data);ui.pose=f.pose;ui.cmpA=ui.cmpB=null;ui.modal=null;render();toast('Foto salva')}
    catch(err){toast('Não consegui salvar essa foto')}
    return;
  }
  if(e.target.id==='cadCapaIn'&&e.target.files&&e.target.files[0]){
    try{ui.cad.capa=await comprimir(e.target.files[0],1400,.8);ui.cad.capaNova=true;render()}catch(err){toast('Não consegui abrir essa foto')}
    return;
  }
  if(e.target.id==='bnIn'&&e.target.files&&e.target.files[0]){
    try{const img=await comprimir(e.target.files[0],1400,.8);const b={id:uid(),img,link:''};BANNERS.push(b);render();await salvaBanners(false,b);toast('Banner adicionado')}catch(err){toast('Não consegui abrir essa imagem')}
    return;
  }
  if(e.target.id==='fotoP'&&e.target.files&&e.target.files[0]){
    try{PP.foto=await comprimir(e.target.files[0],360,.82);persist('perfilP');render();toast('Foto atualizada')}catch(err){toast('Não consegui abrir essa imagem')}
    return;
  }
  if(e.target.id==='fotoCheck'&&e.target.files&&e.target.files[0]){
    try{const img=await comprimir(e.target.files[0],1400,.88);montaStory(img)}catch(err){toast('Não consegui abrir essa foto')}
    return;
  }
  if(e.target.id!=='fotoIn'||!e.target.files||!e.target.files[0]) return;
  const file=e.target.files[0], rd=new FileReader();
  rd.onload=()=>{const img=new Image();img.onload=()=>{
    const S2=360,c=document.createElement('canvas');c.width=c.height=S2;const ctx=c.getContext('2d');
    const m=Math.min(img.width,img.height);ctx.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S2,S2);
    const id=SES.alunoId;PERF[id].foto=c.toDataURL('image/jpeg',.82);persist('perfil:'+id);render();toast('Foto atualizada');
  };img.onerror=()=>toast('Não consegui abrir essa imagem');img.src=rd.result};
  rd.readAsDataURL(file);
});
document.addEventListener('submit',async e=>{
  e.preventDefault();
  const id=e.target.id, fd=new FormData(e.target);
  if(id==='fLogin') return FB?entrarFB(fd.get('codigo')):entrar(fd.get('nome'),fd.get('codigo'));
  if(id==='fLoginP') return entrarPersonal(fd.get('email'),fd.get('senha'));
  if(id==='fModelo'){const nome=String(fd.get('nome')||'').trim();if(!nome)return;salvarModeloDe(S,nome,String(fd.get('desc')||'').trim());ui.modal=null;renderOv();toast('Modelo salvo');return}
  if(id==='fTrocaCod'){
    const m=ui.modal, c1=limpaCod(fd.get('c1')), c2=limpaCod(fd.get('c2'));
    if(c1!==c2){m.err='Os dois códigos não são iguais.';return renderOv()}
    if(!/^[A-Z0-9]{6,20}$/.test(c1)){m.err='Use de 6 a 20 letras ou números, sem espaço.';return renderOv()}
    m.busy=true;m.err='';renderOv();
    try{const er=await trocarCodigoAluno(c1);if(er){m.busy=false;m.err=er;return renderOv()}
      ui.modal=null;render();toast('Código trocado. Agora é '+c1)}
    catch(err){m.busy=false;m.err='Não consegui trocar agora. Tente de novo.';renderOv()}
    return;
  }
  if(id==='fPeso'){
    const kg=num(fd.get('kg')), dt=new Date(String(fd.get('data'))+'T12:00').getTime();
    if(!(kg>20&&kg<400)) return toast('Peso inválido');
    const aid=SES.alunoId, pf=PERF[aid]; pf.pesos.push({kg,data:isNaN(dt)?Date.now():dt}); pf.pesos.sort((x,y)=>x.data-y.data);
    persist('perfil:'+aid); ui.modal=null; render(); toast('Peso registrado'); return;
  }
  if(id==='fAluno'){
    const aid=e.target.dataset.id, nome=String(fd.get('nome')).trim(), cod=String(fd.get('codigo')).trim().toUpperCase();
    if(!nome) return toast('Digite o nome');
    if(!codigoLivre(cod,aid)) return toast('Esse código já está em uso');
    if(aid){
      const a=alunoById(aid); a.nome=nome; a.codigo=cod; a.whats=String(fd.get('whats')||'').trim(); persist('alunos');
      const p=PROG[aid]||(PROG[aid]=progVazio());
      [1,2].forEach(n=>{p.fases[String(n)]={nome:String(fd.get('fn'+n)).trim()||'Fase '+n,sub:String(fd.get('fs'+n)).trim(),nota:String(fd.get('fo'+n)).trim()}});
      persist('prog:'+aid); ui.modal=null; render(); toast('Aluno atualizado');
    } else {
      const nid=FB?await keyDe(cod):'a'+uid(), base=String(fd.get('base')||'');
      let p=progVazio();
      if(base&&PROG[base]){p=clone(PROG[base]);p.faseAtiva=1;p.treinos.forEach(t=>{t.id=uid();t.atualizadoEm=Date.now();t.exercicios.forEach(x=>{x.uid=uid();x.carga=''})})}
      PROG[nid]=p; HIST[nid]=histVazio();
      ALU.lista.push({id:nid,nome,codigo:cod,whats:String(fd.get('whats')||'').trim(),criadoEm:Date.now()});
      persist('alunos'); persist('prog:'+nid); persist('hist:'+nid);
      ouvir('hist:'+nid,d=>{HIST[nid]=d;fixaHist(d);if(ui.alunoSel===nid)foco(nid);if(ui.view!=='editor')render()});
      ui.modal=null; acts.abrirAluno({id:nid}); ui.modal={tipo:'msgAluno',id:nid,novo:true}; renderOv();
    }
    return;
  }
  if(id==='fNovoEx'){
    const nome=String(fd.get('nome')).trim(); if(!nome) return;
    BIB.customEx.push({id:'c-'+uid(),nome,g:fd.get('g'),eq:fd.get('eq')}); persist('bib');
    ui.modal=null; ui.filtro=fd.get('g'); render(); toast('Exercício criado'); return;
  }
  if(id==='fVideo'){
    const exId=e.target.dataset.id, u=String(fd.get('url')).trim();
    if(u&&!ytId(u)) return toast('Link do YouTube não reconhecido');
    if(u) BIB.videos[exId]=u; else delete BIB.videos[exId];
    persist('bib'); ui.modal=null; render(); toast(u?'Vídeo salvo':'Vídeo removido'); return;
  }
  if(id==='fAcesso'){
    const pc=String(fd.get('pc')).trim();
    if(!pc) return;
    if(ALU.lista.some(a=>norm(a.codigo)===norm(pc))) return toast('Esse código já é de um aluno');
    ALU.personal={codigo:pc}; persist('alunos'); ui.modal=null; render(); toast('Código atualizado');
  }
});

function renderRest(){
  const el=$('#rest');
  if(!ui.rest||ui.view!=='treino'){el.innerHTML='';return}
  const r=ui.rest, left=(r.fim-Date.now())/1000, end=left<=0;
  if(end&&!r.ended){r.ended=true;alertaFim()}
  el.innerHTML=`<div class="wrap" style="padding:0"><div class="rb ${end?'end':''}">
    <div class="t">${end?'0:00':fmtT(left)}</div><div class="l">${end?'Bora! Próxima série':'Descanso'}</div>
    ${end?'':'<button data-a="restAdd" data-v="-15">−15</button><button data-a="restAdd" data-v="15">+15</button>'}
    <button data-a="restSkip">${end?'Ok':'Pular'}</button>
    <div class="bar" style="width:${end?100:Math.max(0,100-left/r.total*100)}%"></div></div></div>`;
}

  if(ui.view==='treino'&&A){const c=$('#elapsed');if(c)c.textContent=fmtT((Date.now()-A.inicio)/1000)}
  if(ui.rest){ if(ui.rest.ended && Date.now()-ui.rest.fim>8000){ui.rest=null} renderRest() }
},250);

render();
initCloud();
